<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chop Suey</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />
  <!-- <link rel="stylesheet" href="../stylesheets/fontawesome/css/all.min.css" /> -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js"
    integrity="sha256-4iQZ6BVL4qNKlQ27TExEhBN1HFPvAvAMbFavKKosSWQ=" crossorigin="anonymous"></script>

  <script src="https://use.fontawesome.com/1171925253.js"></script>

  <!--<link rel="stylesheet" href="/stylesheets/styles.css">-->
  <style>
    [v-cloak] { visibility: hidden; }
    .lang-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; padding: 6px 12px; background: #e9ecef; border-bottom: 1px solid #dee2e6; }
    .lang-bar .lang-icon { margin-right: 8px; color: #495057; }
    .lang-bar .btn { min-width: 84px; }
    .moebl-list img { max-width: 100%; }
    @media (max-width: 991px) {
      .moebl-list { flex-wrap: wrap; }
    }
    @media (max-width: 576px) {
      .lang-bar .btn-group { flex: 1 1 auto; }
      .lang-bar .btn { min-width: 0; flex: 1 1 0; }
    }
  </style>
</head>

<body>
  <div id="app">
  <div class="lang-bar" v-cloak>
    <span class="lang-icon fa fa-globe" aria-hidden="true"></span>
    <div class="btn-group btn-group-sm" role="group" :aria-label="t('lang.label')">
      <button type="button" v-for="l in languages" :key="l.code" class="btn"
        :class="lang === l.code ? 'btn-primary' : 'btn-outline-primary'" :lang="l.code"
        :aria-pressed="lang === l.code ? 'true' : 'false'" v-on:click="setLang(l.code)">{{ l.label }}</button>
    </div>
  </div>
  <nav class="nnavbar navbar-light bg-light">
    <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse" data-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <a class="navbar-brand" href="#">
      <img
        src="https://s3-us-west-2.amazonaws.com/slack-files2/avatars/2016-01-11/18230715235_c0a76622c4931df1fda8_88.png"
        width="35" height="35" class="d-inline-block align-top" alt="" />
      <span v-cloak>{{ t('nav.brand') }}</span>
    </a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <!-- <a class="nav-link" href="/timerecords">Meine Happy Hours</a> -->
        </li>
      </ul>
    </div>
  </nav>
  <br />
    <booking-form></booking-form>
    <br />
  </div>
</body>

</html>

<script type="text/x-template" id="booking-form">

      <div class="container">
  <div class="progress" v-if="!initialized">
    <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar"  aria-valuemin="0" aria-valuemax="100" :style="{ width: initializerWidth + '%' }"></div>
  </div>
  <div class="row">
    <div class="col-md-12">
    <div class="alert alert-danger" role="alert" v-if="error">
      {{t(error)}}
    </div>
    </div>
  </div>
  <div v-if="initialized && !error">
        <p><b>{{t('s1.title')}}</b></p>
        <div class="form-group">
          <label for="name">{{t('s1.name')}}</label>
          <input type="text" required class="form-control" v-model="booking.name">
        </div>
        <div class="form-group">
          <label for="count">{{t('s1.count')}}</label>
          <input type="number" :min='1' :max='100' required class="form-control" v-model="booking.participantsCount">
        </div>
        <div class="form-group">
          <label for="name">{{t('s1.org')}}</label>
          <input type="text" class="form-control" v-model="booking.person.org">
        </div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" v-model="booking.isNGO" id="isNgo">
          <label class="form-check-label" for="isNgo"> {{t('s1.ngo')}}</label>
        </div>
        <br/><br/>
        <p><b>{{t('s2.title')}}</b></p>
        <div class="form-group">
          <label for="name">{{t('s2.firstName')}}</label>
          <input type="text" required class="form-control" v-model="booking.person.firstName">
        </div>
        <div class="form-group">
          <label for="name">{{t('s2.lastName')}}</label>
          <input type="text" required class="form-control" v-model="booking.person.lastName">
        </div>
        <div class="form-group">
          <label for="email">{{t('s2.email')}}</label>
          <input type="email" required class="form-control" v-model="booking.person.email">
        </div>
        <div class="form-group">
          <label for="tel">{{t('s2.tel')}}</label>
          <input type="tel" required class="form-control" v-model="booking.person.tel">
        </div>

        <p><b>{{t('s3.title')}}</b></p>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="address">{{t('s3.street')}}</label>
            <input class="form-control" required type="text" v-model="booking.person.street"></input>
          </div>
          <div class="form-group col-md-3">
            <label for="address">{{t('s3.hno')}}</label>
            <input class="form-control" required type="text" v-model="booking.person.hno"></input>
          </div>
          <div class="form-group col-md-3">
            <label for="address">{{t('s3.ano')}}</label>
            <input class="form-control" required type="text" v-model="booking.person.ano"></input>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-4">
            <label for="address">{{t('s3.postcode')}}</label>
            <input class="form-control" required type="text" v-model="booking.person.postcode"></input>
          </div>
          <div class="form-group col-md-8">
            <label for="address">{{t('s3.city')}}</label>
            <input class="form-control" required type="text" v-model="booking.person.city"></input>
          </div>
        </div>
        <div class="form-group">
          <label for="name">{{t('s3.uid')}}</label>
          <input type="text" class="form-control" v-model="booking.person.uid">
        </div>
        <br/>
        <p><b>{{t('s4.title')}}</b></p>
        <br/>
        <p><b>{{t('s4.plan')}}</b></p>
        <img src="../images/raumplan.png" style="width: 1110px; max-width: 100%; height: auto">
        <br/>
        <br/>
        <p><b>{{t('s4.variants')}}</b></p>
        <ul class="list-group">
          <li class="list-group-item list-group-item flex-column align-items-start">
            <div class="d-flex w-100 justify-content-between">
              <h5 class="mb-1">{{t('room.Saal groß')}}</h5>
            </div>
            <p class="mb-1">{{t('s4.gross.size')}}</p>
            <p class="mb-1">{{t('s4.foyer')}}</p>
            <p class="mb-1">{{t('s4.station')}}</p>
          </li>
          <li class="list-group-item list-group-item flex-column align-items-start">
            <div class="d-flex w-100 justify-content-between">
              <h5 class="mb-1">{{t('room.Saal klein')}}</h5>
            </div>
            <p class="mb-1">{{t('s4.klein.size')}}</p>
            <p class="mb-1">{{t('s4.foyer')}}</p>
            <p class="mb-1">{{t('s4.klein.wall')}}</p>
          </li>
          <li class="list-group-item list-group-item flex-column align-items-start">
            <div class="d-flex w-100 justify-content-between">
              <h5 class="mb-1">{{t('room.Salon')}}</h5>
            </div>
            <p class="mb-1">{{t('s4.salon.size')}}</p>
            <p class="mb-1">{{t('s4.station')}}</p>
            <p class="mb-1">{{t('s4.salon.wall')}}</p>
          </li>
        </ul>
        <p><i><small><b>{{t('s4.note1')}}</b></small></i></p>
        <p><i><small><b>{{t('s4.note2')}}</b></small></i></p>
        <p><i><small><b>{{t('s4.note3')}}</b></small></i></p>

        <br/>
        <b>{{t('s4.layouts')}}</b>
        <ul class="list-group list-group-horizontal moebl-list">
          <li class="list-group-item"><img src="../images/moeblierung/block.jpg"> {{t('moebl.Block')}}</li>
          <li class="list-group-item"><img src="../images/moeblierung/cafe.jpg"> {{t('moebl.Cafe')}}</li>
          <li class="list-group-item"><img src="../images/moeblierung/carre.png"> {{t('moebl.Carre')}}</li>
          <li class="list-group-item"><img src="../images/moeblierung/kreis.png">{{t('moebl.Kreis')}}</li>
        </ul>
        <ul class="list-group list-group-horizontal moebl-list">
          <li class="list-group-item"><img src="../images/moeblierung/geschwungene-reihen.png"> {{t('moebl.Geschwungene Reihen')}}</li>
          <li class="list-group-item"><img src="../images/moeblierung/uform.jpg">{{t('moebl.U-Form')}}</li>
          <li class="list-group-item"><img src="../images/moeblierung/kino.png">{{t('moebl.Kino')}}</li>
        </ul>
        <br/>
        <br/>
        <p><b>{{t('s5.title')}}</b></p>
        <div class="jumbotron bg-light" v-for="(ts, index) in booking.timeSlots">
          <button type="button" class="btn btn-danger float-right" v-on:click="deleteTimeSlot(index)" :title="t('s5.delete')" :aria-label="t('s5.delete')"><span class="fa fa-trash"></span></button>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="room">{{t('s5.room')}}</label>
              <select class="form-control c-select" id="room" v-model="ts.roomId">
                <option v-for="r in rooms" :value="r.id">{{tOpt('room', r.name)}}</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="date">{{t('s5.date')}}</label>
              <input type="date" required v-model="ts.beginnDate" class="form-control" id="beginn" :lang="$root.lang">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="beginn">{{t('s5.begin')}}</label>
              <select id="hour" class="form-control" v-model="ts.beginnH">
                <option v-for="h in hours" :value="h">{{t('time.hour', {h: h})}}</option>
              </select>
            </div>
            <div class="form-group col-md-2">
              <label class="d-none d-md-block">&nbsp;</label>
              <select class="form-control" id="minute" v-model="ts.beginnM">
                <option v-for="m in mins" :value="m">{{t('time.minutes', {m: m})}}</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="end">{{t('s5.end')}}</label>
              <select id="hour" class="form-control" v-model="ts.endH">
                <option v-for="h in hours" :value="h">{{t('time.hour', {h: h})}}</option>
              </select>
            </div>
            <div class="form-group col-md-2">
              <label class="d-none d-md-block">&nbsp;</label>
              <select class="form-control" id="minute" v-model="ts.endM">
                <option v-for="m in mins" v-bind:value="m">{{t('time.minutes', {m: m})}}</option>
              </select>
            </div>
          </div>
          <div class="alert alert-warning" role="alert" v-html="t('s5.halfDay')"></div>
          <div class="alert alert-warning" role="alert">
            {{t('s5.multiDay')}}
          </div>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="room">{{t('s5.layout')}}</label>
              <select class="form-control c-select" id="moeblierung" v-model="ts.moeblierung">
                <option v-for="m in moeblierungen" :value="m">{{tOpt('moebl', m)}}</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="notes">{{t('common.notes')}}</label>
            <textarea class="form-control" :placeholder="t('s5.notesPlaceholder')" id="tsnotes" rows="5" v-model="ts.notes"></textarea>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="beginn">{{t('s5.hau')}}</label>
            <select class="form-control" id="hear-about-us" v-model="booking.hau">
              <option v-for="hau in hauOptions" v-bind:value="hau">{{ tOpt('hau', hau) }}</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <button type="button" class="btn btn-success float-right" v-on:click="addTimeSlot"><i class="fa fa-plus"></i>&nbsp;{{t('s5.addSlot')}}</button>
          </div>
        </div>
        <p><b>{{t('s6.title')}}</b></p>
        <div style="padding: 10px" class="bg-light">
          <h4>{{t('s6.heading')}}</h4>
          <p>{{t('s6.p1')}}</p>
          <p>{{t('s6.p2')}}</p>
          <p v-html="t('s6.p3')"></p>
          <p v-html="t('s6.p4')"></p>
          <p v-html="t('s6.p5')"></p>
          <div class=" form-group row" v-for="e in booking.equipment">
            <label class="col-sm-4 col-form-label" for="equipment">{{tEquip(e, 'name')}}</label>
            <div class="col-sm-3">
              <select v-if="e.quantity == 1" class="form-control c-select" v-model="e.count">
                <option :value="1">{{t('common.yes')}}</option>
                <option :value="0">{{t('common.no')}}</option>
              </select>
              <input v-else class="form-control" required type="number" :min='0' :max='e.quantity' v-model="e.count"></input>
              <template v-if="e.notesTitle && e.count > 0">
                <br />
                <b>{{tEquip(e, 'notesTitle')}}</b>
                <textarea class="form-control" id="decription" rows="2" v-model="e.notes"></textarea>
              </template>
            </div>
            <div class="col-sm-4">
              {{tEquip(e, 'description')}}
            </div>
          </div>
        </div>

        <br/>
        <div class="form-group">
          <label for="decription">{{t('common.notes')}}</label>
          <textarea class="form-control" id="decription" rows="5" v-model="booking.notes"></textarea>
          <br/>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" v-model="booking.workTypeFloor" id="workTypeFloor">
            <label class="form-check-label" for="workTypeFloor"> {{t('s6.floor')}}</label>
          </div>

          <div class="form-check">
            <input type="checkbox" class="form-check-input" v-model="booking.workTypePaint" id="workTypePaint">
            <label class="form-check-label" for="workTypePaint"> {{t('s6.paint')}}</label>
          </div>
        </div>


      <div class="row">
        <div class="col-md-12">
        <div class="alert alert-success" role="alert" v-if="submitResult && submitResult.success">
          {{t(submitResult.key, submitResult.params)}}
        </div>
        <div class="alert alert-danger" role="alert" v-if="submitResult && !submitResult.success">
          {{t(submitResult.key, submitResult.params)}}
        </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
      <button type="button" class="btn btn-primary" v-on:click="submit" style="min-width: 100px"><i class="fa fa-spinner fa-spin" v-if="loading"></i>{{loading ? '' : t('common.submit')}}</button>

        </div>
    </div>
    </div>
    </div>
</script>
<script src="/buchungssystem/javascripts/booking.js"></script>
